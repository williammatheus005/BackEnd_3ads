<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compras de Roupa</title>
</head>
<body style="font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; color: #333; margin: 0; padding: 20px;">

    <!-- Cabeçalho Principal -->
    <header style="max-width: 1200px; margin: 0 auto 30px auto; display: flex; justify-content: space-between; align-items: center; background-color: #ffffff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);">
        <div>
            <h3 style="margin: 0; color: #1a202c; font-size: 24px; text-transform: capitalize;">🛍️ Página de Compras</h3>
            <p style="margin: 5px 0 0 0; color: #718096; font-size: 14px;">Bem-vindo(a) à nossa loja moderna!</p>
        </div>
        
        <!-- Menu de Navegação Mantendo as Suas Rotas Originais -->
        <nav>
            <a href="/pagina inicial" style="text-decoration: none; color: #ffffff; background-color: #3182ce; padding: 10px 18px; border-radius: 8px; font-weight: 600; font-size: 14px; margin-right: 10px; display: inline-flex; align-items: center; gap: 8px;">
                <span>🛒</span> Compras
            </a>
            <a href="/erro" style="text-decoration: none; color: #e53e3e; background-color: #fff5f5; border: 1px solid #fed7d7; padding: 10px 18px; border-radius: 8px; font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 8px;">
                <span>⚠️</span> Erro
            </a>
        </nav>
    </header>

    <!-- Galeria de Produtos Moderna -->
    <main style="max-width: 1200px; margin: 0 auto;">
        <h4 style="font-size: 20px; color: #2d3748; margin-bottom: 20px; display: inline-flex; align-items: center; gap: 10px;">
            <span>✨</span> Produtos em Destaque
        </h4>
        
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px;">
            
            <!-- Cartão de Produto 1 -->
            <div style="background-color: #ffffff; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); overflow: hidden; padding: 15px; display: flex; flex-direction: column; justify-content: space-between;">
                <!-- Espaço Reservado para Imagem -->
                <div style="width: 100%; height: 200px; background-color: #edf2f7; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #a0aec0; font-weight: 500; margin-bottom: 15px;">
                    🖼️ [Imagem do Produto 1]
                </div>
                <div>
                    <h5 style="margin: 0 0 5px 0; font-size: 16px; color: #2d3748;">Camiseta Minimalista Básica</h5>
                    <p style="margin: 0 0 15px 0; color: #2b6cb0; font-weight: bold; font-size: 18px;">R$ 89,90</p>
                </div>
                <button style="width: 100%; background-color: #2d3748; color: white; border: none; padding: 10px; border-radius: 6px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;">
                    <span>➕</span> Adicionar
                </button>
            </div>

            <!-- Cartão de Produto 2 -->
            <div style="background-color: #ffffff; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); overflow: hidden; padding: 15px; display: flex; flex-direction: column; justify-content: space-between;">
                <!-- Espaço Reservado para Imagem -->
                <div style="width: 100%; height: 200px; background-color: #edf2f7; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #a0aec0; font-weight: 500; margin-bottom: 15px;">
                    🖼️ [Imagem do Produto 2]
                </div>
                <div>
                    <h5 style="margin: 0 0 5px 0; font-size: 16px; color: #2d3748;">Calça Jeans Slim Fit</h5>
                    <p style="margin: 0 0 15px 0; color: #2b6cb0; font-weight: bold; font-size: 18px;">R$ 179,90</p>
                </div>
                <button style="width: 100%; background-color: #2d3748; color: white; border: none; padding: 10px; border-radius: 6px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;">
                    <span>➕</span> Adicionar
                </button>
            </div>

            <!-- Cartão de Produto 3 -->
            <div style="background-color: #ffffff; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); overflow: hidden; padding: 15px; display: flex; flex-direction: column; justify-content: space-between;">
                <!-- Espaço Reservado para Imagem -->
                <div style="width: 100%; height: 200px; background-color: #edf2f7; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #a0aec0; font-weight: 500; margin-bottom: 15px;">
                    🖼️ [Imagem do Produto 3]
                </div>
                <div>
                    <h5 style="margin: 0 0 5px 0; font-size: 16px; color: #2d3748;">Jaqueta Corta Vento</h5>
                    <p style="margin: 0 0 15px 0; color: #2b6cb0; font-weight: bold; font-size: 18px;">R$ 249,90</p>
                </div>
                <button style="width: 100%; background-color: #2d3748; color: white; border: none; padding: 10px; border-radius: 6px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;">
                    <span>➕</span> Adicionar
                </button>
            </div>

        </div>
    </main>

</body>
</html>
